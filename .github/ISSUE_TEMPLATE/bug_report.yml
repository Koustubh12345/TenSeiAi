name: Bug report
description: Report a reproducible problem with TenSeiAi
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include secrets, private data, or
        security vulnerabilities here. Use the private advisory flow for
        security issues.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact command or UI steps.
      placeholder: |
        1. Download ...
        2. Run ...
        3. Ask ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit.
      placeholder: v8.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, architecture, Python version, numpy version.
      placeholder: Windows 11, Python 3.12.6, numpy 2.5.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Paste only the relevant part. Remove paths or data you do not want to share.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true
