name: Build release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Test source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore and verify knowledge database
        run: python scripts/prepare_assets.py

      - name: Run tests
        run: python -m unittest discover -s source/tests -v

  build:
    name: Build pyz and tsei
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore and verify knowledge database
        run: python scripts/prepare_assets.py

      - name: Build release artifacts
        run: python scripts/build_release.py

      - name: Show artifact checksums
        run: cat dist/SHA256SUMS

      - name: Upload build artifacts (Downloadable from summary)
        uses: actions/upload-artifact@v4
        with:
          name: TenSeiAi-artifacts
          path: |
            dist/TenSeiAi.pyz
            dist/TenSeiAi.tsei
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
