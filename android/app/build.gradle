plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'ai.tensei.app'
    compileSdk 34

    defaultConfig {
        applicationId "ai.tensei.app"
        minSdk 21
        targetSdk 34
        versionCode 8
        versionName "8.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

chaquopy {
    defaultConfig {
        version "3.12"
        pip {
            install "numpy"
        }
    }
}
